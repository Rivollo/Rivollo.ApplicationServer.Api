name: CI/CD - Docker to Azure Container Apps (Development)

on:
  push:
    branches:
      - main

env:
  ACR_LOGIN_SERVER: rivollodevacr.azurecr.io
  IMAGE_NAME: rivollo-dev-portal-api
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME }}

permissions:
  id-token: write   # required for OIDC azure/login
  contents: read

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment:
      name: dev
    # No `outputs:` here on purpose. The image reference contains the ACR login
    # server, which matches secrets.ACR_USERNAME, and GitHub refuses to pass job
    # outputs containing secret values — they arrive empty. The deploy job rebuilds
    # the reference from env instead. See "Resolve and validate image reference".

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image metadata
        id: meta
        run: |
          TAG_NUM="build-${GITHUB_RUN_NUMBER}"
          IMAGE_NUM="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG_NUM}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          echo "tag_num=${TAG_NUM}" >> "$GITHUB_OUTPUT"
          echo "image_num=${IMAGE_NUM}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG_NUM}"

      - name: Build and push (numeric + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_num }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_latest }}
          cache-to: type=inline

      - name: Print pushed image digest
        run: |
          echo "GIT_COMMIT=${GITHUB_SHA}"
          docker pull "${{ steps.meta.outputs.image_num }}"
          docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.image_num }}" || true

  deploy:
    name: Deploy to Azure Container Apps (Dev)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: dev

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deliberately NOT `needs.build.outputs.image_num`. GitHub drops any job
      # output whose value contains a secret, and the ACR admin username is the
      # registry name itself (secrets.ACR_USERNAME == "rivollodevacr"), which
      # appears inside every image reference. So that output always arrived empty,
      # and `az containerapp update --image ""` is a no-op that exits 0 — the cause
      # of weeks of green deploys that shipped nothing to dev and prod.
      #
      # Rebuild the reference here instead, from non-secret workflow env plus
      # GITHUB_RUN_NUMBER, which is identical across jobs in the same run and so
      # matches the tag the build job pushed. Nothing crosses a job boundary.
      - name: Resolve and validate image reference
        run: |
          set -euo pipefail
          if [ -z "${ACR_LOGIN_SERVER:-}" ] || [ -z "${IMAGE_NAME:-}" ]; then
            echo "::error::ACR_LOGIN_SERVER or IMAGE_NAME is empty — cannot build an image reference."
            exit 1
          fi
          if [ -z "${CONTAINERAPP_NAME:-}" ] || [ -z "${AZURE_RESOURCE_GROUP:-}" ]; then
            echo "::error::CONTAINERAPP_NAME or AZURE_RESOURCE_GROUP is empty — check the repo/environment variables."
            exit 1
          fi
          TAG_NUM="build-${GITHUB_RUN_NUMBER}"
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG_NUM}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # The registry host is masked as *** in logs because it matches a secret;
          # the tag is the useful part to read here.
          echo "Deploying tag: ${TAG_NUM}"

      # Captured before the update so the next step can prove Azure actually rolled
      # something out, rather than trusting that asking was enough.
      - name: Record currently deployed revision
        run: |
          set -euo pipefail
          REV_BEFORE=$(az containerapp show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.latestRevisionName" -o tsv)
          echo "REV_BEFORE=${REV_BEFORE}" >> "$GITHUB_ENV"
          echo "Currently deployed revision: ${REV_BEFORE:-<none>}"

      # Application configuration, sourced from GitHub rather than typed into the
      # container app by hand.
      #
      # The point is reviewability and recovery. Configuration that exists only
      # as live Azure state cannot be diffed, cannot appear in a pull request,
      # and cannot be restored if the app is recreated. GOOGLE_CLIENT_ID pointed
      # at the wrong Google project for weeks precisely because there was no
      # artefact anyone could have compared against the Portal's value.
      #
      # Two properties make this safe to adopt gradually:
      #
      #   * A name absent from GitHub is SKIPPED, never set to empty. Blanking a
      #     working DATABASE_URL because a secret had not been created yet would
      #     be a far worse outcome than leaving it manual, and an empty value is
      #     not inert -- GOOGLE_CLIENT_ID="" rejects every token rather than
      #     disabling the check. Every skipped name is listed in the run log, so
      #     the remaining manual surface is visible on every deploy.
      #
      #   * --set-env-vars merges. Names not mentioned here keep whatever the app
      #     already has. (--replace-env-vars would delete them, DATABASE_URL
      #     included -- do not substitute it.)
      #
      # Values arrive through `env:` instead of being interpolated into the
      # script. A ${{ }} expression is textual substitution, so a value holding a
      # quote or backtick would otherwise be executed as shell.
      - name: Deploy image and configuration to Container App
        env:
          ACCESS_TOKEN_EXPIRES_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRES_MINUTES }}
          AI_LINK_URL_MAX_CHARS: ${{ vars.AI_LINK_URL_MAX_CHARS }}
          AI_USER_INPUT_DESC_MAX_CHARS: ${{ vars.AI_USER_INPUT_DESC_MAX_CHARS }}
          AI_USER_INPUT_NAME_MAX_CHARS: ${{ vars.AI_USER_INPUT_NAME_MAX_CHARS }}
          AI_USER_PROMPT_MAX_CHARS: ${{ vars.AI_USER_PROMPT_MAX_CHARS }}
          APP_CLIENT_KEYS: ${{ secrets.APP_CLIENT_KEYS }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_TOKEN_EXPIRES_MINUTES: ${{ vars.APP_TOKEN_EXPIRES_MINUTES }}
          AZURE_BLOB_BASE_URL: ${{ vars.AZURE_BLOB_BASE_URL }}
          AZURE_JOB_IMAGE: ${{ vars.AZURE_JOB_IMAGE }}
          AZURE_JOB_NAME: ${{ vars.AZURE_JOB_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONN_STRING: ${{ secrets.AZURE_STORAGE_CONN_STRING }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: ${{ vars.DEBUG }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FCM_DRY_RUN: ${{ vars.FCM_DRY_RUN }}
          FIREBASE_JSON_PATH: ${{ vars.FIREBASE_JSON_PATH }}
          FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GPU_COLD_START_SECONDS: ${{ vars.GPU_COLD_START_SECONDS }}
          JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MANAGED_IDENTITY_CLIENT_ID: ${{ vars.MANAGED_IDENTITY_CLIENT_ID }}
          MODEL_3D_API_BASE_URL: ${{ vars.MODEL_3D_API_BASE_URL }}
          MODEL_SERVICE_URL: ${{ vars.MODEL_SERVICE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_URL: ${{ vars.OPENAI_CHAT_URL }}
          OPENAI_MAX_TOKENS: ${{ vars.OPENAI_MAX_TOKENS }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_USE_AZURE: ${{ vars.OPENAI_USE_AZURE }}
          PASSWORD_RESET_OTP_EXPIRES_MINUTES: ${{ vars.PASSWORD_RESET_OTP_EXPIRES_MINUTES }}
          PASSWORD_RESET_TOKEN_EXPIRES_MINUTES: ${{ vars.PASSWORD_RESET_TOKEN_EXPIRES_MINUTES }}
          QUOTA_NOTIFICATION_THRESHOLDS: ${{ vars.QUOTA_NOTIFICATION_THRESHOLDS }}
          RAZORPAY_BASE_URL: ${{ vars.RAZORPAY_BASE_URL }}
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ vars.RESEND_FROM_NAME }}
          SAMPLING_RATIO: ${{ vars.SAMPLING_RATIO }}
          SERVICEBUS_CONNECTION_STRING: ${{ secrets.SERVICEBUS_CONNECTION_STRING }}
          SERVICEBUS_QUEUE_NAME: ${{ vars.SERVICEBUS_QUEUE_NAME }}
          SIGNUP_OTP_EXPIRES_MINUTES: ${{ vars.SIGNUP_OTP_EXPIRES_MINUTES }}
          SIGNUP_TOKEN_EXPIRES_MINUTES: ${{ vars.SIGNUP_TOKEN_EXPIRES_MINUTES }}
          STORAGE_CONTAINER_UPLOADS: ${{ vars.STORAGE_CONTAINER_UPLOADS }}
          SUBSCRIPTION_EXPIRY_REMINDER_DAYS: ${{ vars.SUBSCRIPTION_EXPIRY_REMINDER_DAYS }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          TRIPO_API_KEY: ${{ secrets.TRIPO_API_KEY }}
          USE_MANAGED_IDENTITY: ${{ vars.USE_MANAGED_IDENTITY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TEMPLATE_NAME: ${{ vars.WHATSAPP_TEMPLATE_NAME }}
          WS_NOTIFY_CHANNEL: ${{ vars.WS_NOTIFY_CHANNEL }}
        run: |
          set -euo pipefail

          ENV_ARGS=()
          MISSING=()

          add() {
            local name="$1" value="${2:-}"
            if [ -n "$value" ]; then
              ENV_ARGS+=("${name}=${value}")
            else
              MISSING+=("$name")
            fi
          }

          add ACCESS_TOKEN_EXPIRES_MINUTES "${ACCESS_TOKEN_EXPIRES_MINUTES:-}"
          add AI_LINK_URL_MAX_CHARS "${AI_LINK_URL_MAX_CHARS:-}"
          add AI_USER_INPUT_DESC_MAX_CHARS "${AI_USER_INPUT_DESC_MAX_CHARS:-}"
          add AI_USER_INPUT_NAME_MAX_CHARS "${AI_USER_INPUT_NAME_MAX_CHARS:-}"
          add AI_USER_PROMPT_MAX_CHARS "${AI_USER_PROMPT_MAX_CHARS:-}"
          add APP_CLIENT_KEYS "${APP_CLIENT_KEYS:-}"
          add APP_NAME "${APP_NAME:-}"
          add APP_TOKEN_EXPIRES_MINUTES "${APP_TOKEN_EXPIRES_MINUTES:-}"
          add AZURE_BLOB_BASE_URL "${AZURE_BLOB_BASE_URL:-}"
          add AZURE_JOB_IMAGE "${AZURE_JOB_IMAGE:-}"
          add AZURE_JOB_NAME "${AZURE_JOB_NAME:-}"
          add AZURE_RESOURCE_GROUP "${AZURE_RESOURCE_GROUP:-}"
          add AZURE_STORAGE_ACCOUNT "${AZURE_STORAGE_ACCOUNT:-}"
          add AZURE_STORAGE_CONN_STRING "${AZURE_STORAGE_CONN_STRING:-}"
          add AZURE_STORAGE_KEY "${AZURE_STORAGE_KEY:-}"
          add AZURE_SUBSCRIPTION_ID "${AZURE_SUBSCRIPTION_ID:-}"
          add CDN_BASE_URL "${CDN_BASE_URL:-}"
          add DATABASE_URL "${DATABASE_URL:-}"
          add DEBUG "${DEBUG:-}"
          add FAL_KEY "${FAL_KEY:-}"
          add FCM_DRY_RUN "${FCM_DRY_RUN:-}"
          add FIREBASE_JSON_PATH "${FIREBASE_JSON_PATH:-}"
          add FIREBASE_SERVICE_ACCOUNT_JSON_B64 "${FIREBASE_SERVICE_ACCOUNT_JSON_B64:-}"
          add FRONTEND_URL "${FRONTEND_URL:-}"
          add GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID:-}"
          add GPU_COLD_START_SECONDS "${GPU_COLD_START_SECONDS:-}"
          add JWT_ALGORITHM "${JWT_ALGORITHM:-}"
          add JWT_SECRET "${JWT_SECRET:-}"
          add MANAGED_IDENTITY_CLIENT_ID "${MANAGED_IDENTITY_CLIENT_ID:-}"
          add MODEL_3D_API_BASE_URL "${MODEL_3D_API_BASE_URL:-}"
          add MODEL_SERVICE_URL "${MODEL_SERVICE_URL:-}"
          add OPENAI_API_KEY "${OPENAI_API_KEY:-}"
          add OPENAI_CHAT_URL "${OPENAI_CHAT_URL:-}"
          add OPENAI_MAX_TOKENS "${OPENAI_MAX_TOKENS:-}"
          add OPENAI_MODEL "${OPENAI_MODEL:-}"
          add OPENAI_USE_AZURE "${OPENAI_USE_AZURE:-}"
          add PASSWORD_RESET_OTP_EXPIRES_MINUTES "${PASSWORD_RESET_OTP_EXPIRES_MINUTES:-}"
          add PASSWORD_RESET_TOKEN_EXPIRES_MINUTES "${PASSWORD_RESET_TOKEN_EXPIRES_MINUTES:-}"
          add QUOTA_NOTIFICATION_THRESHOLDS "${QUOTA_NOTIFICATION_THRESHOLDS:-}"
          add RAZORPAY_BASE_URL "${RAZORPAY_BASE_URL:-}"
          add RAZORPAY_KEY_ID "${RAZORPAY_KEY_ID:-}"
          add RAZORPAY_KEY_SECRET "${RAZORPAY_KEY_SECRET:-}"
          add RAZORPAY_WEBHOOK_SECRET "${RAZORPAY_WEBHOOK_SECRET:-}"
          add RESEND_API_KEY "${RESEND_API_KEY:-}"
          add RESEND_FROM_EMAIL "${RESEND_FROM_EMAIL:-}"
          add RESEND_FROM_NAME "${RESEND_FROM_NAME:-}"
          add SAMPLING_RATIO "${SAMPLING_RATIO:-}"
          add SERVICEBUS_CONNECTION_STRING "${SERVICEBUS_CONNECTION_STRING:-}"
          add SERVICEBUS_QUEUE_NAME "${SERVICEBUS_QUEUE_NAME:-}"
          add SIGNUP_OTP_EXPIRES_MINUTES "${SIGNUP_OTP_EXPIRES_MINUTES:-}"
          add SIGNUP_TOKEN_EXPIRES_MINUTES "${SIGNUP_TOKEN_EXPIRES_MINUTES:-}"
          add STORAGE_CONTAINER_UPLOADS "${STORAGE_CONTAINER_UPLOADS:-}"
          add SUBSCRIPTION_EXPIRY_REMINDER_DAYS "${SUBSCRIPTION_EXPIRY_REMINDER_DAYS:-}"
          add SUPPORT_EMAIL "${SUPPORT_EMAIL:-}"
          add TRIPO_API_KEY "${TRIPO_API_KEY:-}"
          add USE_MANAGED_IDENTITY "${USE_MANAGED_IDENTITY:-}"
          add WHATSAPP_ACCESS_TOKEN "${WHATSAPP_ACCESS_TOKEN:-}"
          add WHATSAPP_API_VERSION "${WHATSAPP_API_VERSION:-}"
          add WHATSAPP_PHONE_NUMBER_ID "${WHATSAPP_PHONE_NUMBER_ID:-}"
          add WHATSAPP_TEMPLATE_NAME "${WHATSAPP_TEMPLATE_NAME:-}"
          add WS_NOTIFY_CHANNEL "${WS_NOTIFY_CHANNEL:-}"

          echo "Applying ${#ENV_ARGS[@]} variables from GitHub."
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Still managed by hand on the container app -- not \
          defined in GitHub, so their existing values are left untouched: ${MISSING[*]}"
          fi

          UPDATE_ARGS=(--image "$IMAGE")
          # Passing --set-env-vars with no pairs is an error, and on a first run
          # with nothing migrated yet the array is legitimately empty.
          if [ ${#ENV_ARGS[@]} -gt 0 ]; then
            UPDATE_ARGS+=(--set-env-vars "${ENV_ARGS[@]}")
          fi

          az containerapp update \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            "${UPDATE_ARGS[@]}"

      # Two assertions, and the second is the one that actually matters.
      #
      # Comparing the image string only proves the config says what we asked for.
      # It does not prove a container was ever started from it: when the requested
      # reference already equals the applied one -- a re-run re-pushing the same
      # mutable build-N tag, or a redeploy of the current tag -- Azure has no
      # template change to act on, creates no revision, and latestRevisionName
      # stays pointing at the revision that was already running. A health check
      # would then grade that old revision, find it Running, and pass. Green run,
      # nothing shipped. So require the revision to have actually changed.
      - name: Verify a new revision was created
        run: |
          set -euo pipefail
          APPLIED=$(az containerapp show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Requested: $IMAGE"
          echo "Applied  : $APPLIED"
          if [ "$APPLIED" != "$IMAGE" ]; then
            echo "::error::Image was NOT applied — app is still on '$APPLIED'. \
          The update call reported success without changing the app configuration."
            exit 1
          fi

          # latestRevisionName can lag the update by a few seconds, so poll rather
          # than reading it once and racing.
          REV="$REV_BEFORE"
          for i in $(seq 1 12); do
            REV=$(az containerapp show \
              --name "$CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv)
            [ "$REV" != "$REV_BEFORE" ] && break
            echo "Waiting for a new revision to appear (still ${REV:-<none>}) ... ($i/12)"
            sleep 5
          done

          if [ "$REV" = "$REV_BEFORE" ]; then
            echo "::error::No new revision was created — still '$REV_BEFORE'. The image \
          reference did not change, so Azure had nothing to roll out. The previously running \
          revision is still serving and this deploy did NOT take effect."
            exit 1
          fi
          echo "REV=${REV}" >> "$GITHUB_ENV"
          echo "::notice::New revision created: ${REV} (previous: ${REV_BEFORE:-<none>})"

      - name: Wait for revision to be healthy
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=30   # 30 × 10s = 5 min
          RUNNING_STATE=""
          PROV_STATE=""
          # Poll the revision this deploy created (properties.latestRevisionName),
          # NOT "newest by createdTime" — the latter can lock onto an unrelated
          # revision and report healthy for the wrong one.
          for i in $(seq 1 $MAX_ATTEMPTS); do
            RUNNING_STATE=$(az containerapp revision show \
              --name "$CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$REV" \
              --query "properties.runningState" -o tsv)
            PROV_STATE=$(az containerapp revision show \
              --name "$CONTAINERAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$REV" \
              --query "properties.provisioningState" -o tsv)
            echo "Revision $REV running=$RUNNING_STATE provisioning=$PROV_STATE (attempt $i/$MAX_ATTEMPTS)"
            case "$RUNNING_STATE" in
              Running|RunningAtMaxScale)
                echo "::notice::Revision $REV is healthy"
                exit 0
                ;;
              # This app runs minReplicas=0 behind an HTTP scaler, so an idle
              # revision reports Stopped (or ScaledToZero) with 0 replicas. That
              # is a successful deploy waiting for its first request — not a
              # failure. Provisioned is the signal that matters here.
              Stopped|ScaledToZero)
                if [ "$PROV_STATE" = "Provisioned" ]; then
                  echo "::notice::Revision $REV provisioned and idle (scaled to zero). Deploy succeeded."
                  exit 0
                fi
                ;;
              Failed|Degraded|ActivationFailed)
                echo "::error::Revision $REV reached terminal failure state ($RUNNING_STATE)"
                break
                ;;
            esac
            sleep 10
          done

          echo "::warning::Revision did not reach a healthy state — last seen running=$RUNNING_STATE provisioning=$PROV_STATE"

          echo "::group::Container logs"
          az containerapp logs show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$REV" \
            --tail 200 || true
          echo "::endgroup::"

          echo "::group::System logs"
          az containerapp logs show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --type system --tail 200 || true
          echo "::endgroup::"

          # Narrow projection on purpose. `revision show -o yaml` dumps the whole
          # template including every container env var, which printed live API
          # keys into this public-to-the-org log on every failed deploy.
          echo "::group::Revision summary (no env vars)"
          az containerapp revision show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$REV" \
            --query "{name:name, image:properties.template.containers[0].image, running:properties.runningState, provisioning:properties.provisioningState, health:properties.healthState, replicas:properties.replicas, created:properties.createdTime}" \
            -o json || true
          echo "::endgroup::"

          exit 1
